[package]
name = "portcrush"
version = "0.0.1"
edition = "2021"
description = "Beautiful TUI port manager"
license = "MIT"
repository = "https://github.com/arthurrmp/portcrush"
keywords = ["port", "kill", "tui", "terminal", "webdev"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
